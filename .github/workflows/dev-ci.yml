name: Server Dev CI/CD

on:
  push:
    branches: [develop]
    paths:
      - "apps/server/**"
      - ".github/workflows/dev-ci.yml"

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dr-reborn-server-dev
  # ECS_CLUSTER: your-cluster
  # ECS_SERVICE: your-service
  # TASK_DEFINITION_FAMILY: your-task-family

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          cd apps/server
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest \
            .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # TODO: Uncomment when ECS is configured
      # - name: Download current task definition
      #   run: |
      #     aws ecs describe-task-definition \
      #       --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
      #       --query taskDefinition > task-definition.json

      # - name: Render Amazon ECS task definition
      #   id: render-task-def
      #   uses: aws-actions/amazon-ecs-render-task-definition@v1
      #   with:
      #     task-definition: task-definition.json
      #     container-name: server
      #     image: ${{ steps.build-image.outputs.image }}

      # - name: Deploy to Amazon ECS
      #   uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      #   with:
      #     task-definition: ${{ steps.render-task-def.outputs.task-definition }}
      #     service: ${{ env.ECS_SERVICE }}
      #     cluster: ${{ env.ECS_CLUSTER }}
      #     wait-for-service-stability: true
      #     wait-for-minutes: 10

      - name: Build summary
        if: success()
        run: |
          echo "### Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: **Development**" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.build-image.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
